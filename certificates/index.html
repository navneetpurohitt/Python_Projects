<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --card: #1a1a26;
  --border: #2a2a3d;
  --accent: #7c6af7;
  --accent2: #f7c26a;
  --green: #4ade80;
  --red: #f87171;
  --text: #e8e8f0;
  --muted: #6b6b85;
  --radius: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Ambient background orbs */
body::before {
  content:'';
  position:fixed; top:-200px; left:-200px;
  width:600px; height:600px;
  background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}
body::after {
  content:'';
  position:fixed; bottom:-200px; right:-200px;
  width:500px; height:500px;
  background: radial-gradient(circle, rgba(247,194,106,0.08) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

.layout {
  display:grid;
  grid-template-columns: 260px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
  position: relative; z-index:1;
}

/* ── HEADER ── */
header {
  grid-column: 1/-1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(12px);
  position: sticky; top:0; z-index:100;
}

.logo {
  font-family:'Syne', sans-serif;
  font-weight:800; font-size:1.3rem;
  letter-spacing:-0.02em;
}
.logo span { color:var(--accent); }

.header-date {
  font-size:0.75rem; color:var(--muted);
  letter-spacing:0.1em; text-transform:uppercase;
}

.tab-bar { display:flex; gap:4px; }
.tab {
  padding:6px 16px; border-radius:8px;
  font-family:'DM Mono',monospace; font-size:0.78rem;
  border:1px solid transparent; cursor:pointer;
  transition: all .2s; background:transparent; color:var(--muted);
}
.tab.active, .tab:hover {
  background:var(--card); border-color:var(--border); color:var(--text);
}
.tab.active { color:var(--accent); border-color:var(--accent); }

/* ── SIDEBAR ── */
aside {
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  overflow-y: auto;
  background: var(--surface);
}

.aside-title {
  font-family:'Syne',sans-serif; font-weight:700;
  font-size:0.7rem; letter-spacing:0.15em;
  text-transform:uppercase; color:var(--muted);
  margin-bottom:14px; padding: 0 8px;
}

.date-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; border-radius:10px; cursor:pointer;
  transition:all .15s; margin-bottom:4px;
  border:1px solid transparent;
}
.date-item:hover { background:var(--card); border-color:var(--border); }
.date-item.active { background:var(--card); border-color:var(--accent); }
.date-item .d-label { font-size:0.82rem; }
.date-item .d-pct {
  font-size:0.7rem; color:var(--muted);
}
.date-item .d-pct.full { color:var(--green); }

.sidebar-new-day {
  display:flex; align-items:center; gap:8px;
  padding:10px 12px; border-radius:10px;
  border:1px dashed var(--border); cursor:pointer;
  color:var(--muted); font-size:0.82rem;
  transition:all .15s; margin-bottom:12px;
}
.sidebar-new-day:hover { border-color:var(--accent); color:var(--accent); }

/* ── MAIN ── */
main {
  padding:32px;
  overflow-y:auto;
}

/* ── VIEWS ── */
.view { display:none; }
.view.active { display:block; }

/* ── DAY VIEW ── */
.day-header {
  display:flex; align-items:center; gap:16px; margin-bottom:28px;
}
.day-title {
  font-family:'Syne',sans-serif; font-weight:800; font-size:1.8rem;
  letter-spacing:-0.03em;
}
.day-subtitle { font-size:0.78rem; color:var(--muted); }

/* Progress ring */
.progress-ring-wrap {
  position:relative; width:80px; height:80px; flex-shrink:0;
}
.progress-ring-wrap svg { transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--border); stroke-width:6; }
.ring-fill {
  fill:none; stroke:var(--accent); stroke-width:6;
  stroke-linecap:round;
  transition: stroke-dashoffset .5s ease;
}
.ring-text {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.ring-pct { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; }
.ring-label { font-size:0.55rem; color:var(--muted); text-transform:uppercase; }

/* Stats bar */
.stats-row {
  display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap;
}
.stat-chip {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px 18px;
  display:flex; flex-direction:column; gap:2px;
}
.stat-chip .s-val {
  font-family:'Syne',sans-serif; font-weight:700; font-size:1.3rem;
}
.stat-chip .s-lbl { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
.stat-chip.green .s-val { color:var(--green); }
.stat-chip.amber .s-val { color:var(--accent2); }
.stat-chip.purple .s-val { color:var(--accent); }

/* Progress bar */
.progress-bar-wrap { margin-bottom:28px; }
.progress-bar-track {
  height:8px; border-radius:99px;
  background:var(--border); overflow:hidden;
}
.progress-bar-fill {
  height:100%; border-radius:99px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
.progress-bar-label {
  display:flex; justify-content:space-between;
  font-size:0.72rem; color:var(--muted); margin-bottom:6px;
}

/* Task list */
.task-list { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }

.task-item {
  display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
  transition:all .2s; cursor:default;
  animation: slideIn .2s ease forwards;
}
@keyframes slideIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.task-item:hover { border-color:var(--accent); box-shadow:0 0 0 1px rgba(124,106,247,0.15); }
.task-item.done { opacity:0.55; }
.task-item.done .task-text { text-decoration:line-through; color:var(--muted); }

.checkbox {
  width:22px; height:22px; border-radius:6px;
  border:2px solid var(--border); cursor:pointer;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.checkbox:hover { border-color:var(--accent); }
.checkbox.checked {
  background:var(--accent); border-color:var(--accent);
}
.checkbox.checked::after {
  content:'✓'; color:#fff; font-size:0.75rem; font-weight:700;
}

.task-text { flex:1; font-size:0.88rem; }

.task-priority {
  font-size:0.65rem; padding:2px 8px; border-radius:99px;
  font-weight:500; letter-spacing:0.05em;
}
.task-priority.high { background:rgba(248,113,113,0.15); color:var(--red); }
.task-priority.mid  { background:rgba(247,194,106,0.15); color:var(--accent2); }
.task-priority.low  { background:rgba(74,222,128,0.15);  color:var(--green); }

.task-delete {
  background:none; border:none; color:var(--muted);
  cursor:pointer; font-size:0.9rem; padding:2px 4px;
  border-radius:4px; transition:.15s;
  opacity:0;
}
.task-item:hover .task-delete { opacity:1; }
.task-delete:hover { color:var(--red); }

/* Add task */
.add-task-row {
  display:flex; gap:10px; align-items:center;
}
.task-input {
  flex:1; background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px 16px; color:var(--text);
  font-family:'DM Mono',monospace; font-size:0.85rem;
  outline:none; transition:border-color .15s;
}
.task-input:focus { border-color:var(--accent); }
.task-input::placeholder { color:var(--muted); }

.priority-select {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px 10px; color:var(--text);
  font-family:'DM Mono',monospace; font-size:0.82rem;
  outline:none; cursor:pointer;
}

.btn {
  background:var(--accent); color:#fff;
  border:none; border-radius:10px; padding:12px 20px;
  font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem;
  cursor:pointer; transition:all .15s; letter-spacing:0.02em;
}
.btn:hover { background:#9585f9; transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn-ghost {
  background:transparent; color:var(--muted);
  border:1px solid var(--border);
}
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); background:transparent; }

/* ── CHARTS VIEW ── */
.charts-grid {
  display:grid; grid-template-columns: 1fr 1fr;
  gap:20px; margin-bottom:24px;
}
.chart-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px;
}
.chart-card.full { grid-column:1/-1; }
.chart-title {
  font-family:'Syne',sans-serif; font-weight:700; font-size:0.9rem;
  margin-bottom:16px; letter-spacing:-0.01em;
}
.chart-canvas { width:100% !important; }

/* ── CONSOLIDATED VIEW ── */
.cons-table {
  width:100%; border-collapse:collapse;
}
.cons-table th {
  text-align:left; font-size:0.7rem; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--muted);
  padding:10px 14px; border-bottom:1px solid var(--border);
}
.cons-table td {
  padding:12px 14px; font-size:0.83rem;
  border-bottom:1px solid rgba(42,42,61,0.5);
}
.cons-table tr:hover td { background:rgba(124,106,247,0.04); }

.pct-bar-inline {
  display:flex; align-items:center; gap:10px;
}
.pct-bar-inline .bar {
  flex:1; height:6px; border-radius:99px; background:var(--border); overflow:hidden;
}
.pct-bar-inline .fill {
  height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
}
.pct-val { font-size:0.75rem; color:var(--muted); min-width:36px; }

.badge {
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:6px; font-size:0.75rem;
  background:rgba(74,222,128,0.15); color:var(--green);
}
.badge.incomplete { background:rgba(248,113,113,0.12); color:var(--red); }

/* empty state */
.empty-state {
  text-align:center; padding:60px 20px; color:var(--muted);
}
.empty-state .icon { font-size:2.5rem; margin-bottom:12px; }
.empty-state p { font-size:0.85rem; }

/* toast */
.toast {
  position:fixed; bottom:24px; right:24px;
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:12px 18px;
  font-size:0.82rem; z-index:999;
  transform:translateY(60px); opacity:0;
  transition:all .3s;
  pointer-events:none;
}
.toast.show { transform:translateY(0); opacity:1; }

/* date picker */
.datepicker-row {
  display:flex; align-items:center; gap:10px; margin-bottom:20px;
}
.date-input {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:10px 14px; color:var(--text);
  font-family:'DM Mono',monospace; font-size:0.85rem;
  outline:none; cursor:pointer;
  color-scheme: dark;
}
</style>
</head>
<body>

<div class="layout">
  <header>
    <div class="logo">task<span>.</span>daily</div>
    <div class="tab-bar">
      <button class="tab active" onclick="showView('day')">📋 Day View</button>
      <button class="tab" onclick="showView('charts')">📊 Analytics</button>
      <button class="tab" onclick="showView('consolidated')">🗂 All Days</button>
    </div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- SIDEBAR -->
  <aside>
    <div class="aside-title">History</div>
    <div class="sidebar-new-day" onclick="newDayToday()">
      <span>＋</span> Today's Tasks
    </div>
    <div id="dateList"></div>
  </aside>

  <!-- MAIN -->
  <main>

    <!-- DAY VIEW -->
    <div class="view active" id="view-day">
      <div class="day-header">
        <div class="progress-ring-wrap">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="32"/>
            <circle class="ring-fill" id="ringFill" cx="40" cy="40" r="32"
              stroke-dasharray="201" stroke-dashoffset="201"/>
          </svg>
          <div class="ring-text">
            <div class="ring-pct" id="ringPct">0%</div>
            <div class="ring-label">done</div>
          </div>
        </div>
        <div>
          <div class="day-title" id="dayTitle">—</div>
          <div class="day-subtitle" id="daySubtitle"></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-chip purple">
          <div class="s-val" id="statTotal">0</div>
          <div class="s-lbl">Total Tasks</div>
        </div>
        <div class="stat-chip green">
          <div class="s-val" id="statDone">0</div>
          <div class="s-lbl">Completed</div>
        </div>
        <div class="stat-chip amber">
          <div class="s-val" id="statLeft">0</div>
          <div class="s-lbl">Remaining</div>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span>Progress</span>
          <span id="pbarLabel">0 / 0</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>
      </div>

      <div class="task-list" id="taskList"></div>

      <div class="add-task-row">
        <input class="task-input" id="taskInput" placeholder="Add a new task…" onkeydown="if(event.key==='Enter')addTask()"/>
        <select class="priority-select" id="prioritySelect">
          <option value="mid">⚡ Mid</option>
          <option value="high">🔥 High</option>
          <option value="low">🌿 Low</option>
        </select>
        <button class="btn" onclick="addTask()">Add</button>
      </div>
    </div>

    <!-- CHARTS VIEW -->
    <div class="view" id="view-charts">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:24px;letter-spacing:-0.02em">
        Analytics Overview
      </div>
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">Daily Completion %</div>
          <canvas id="lineChart" class="chart-canvas" height="180"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">Tasks Done vs Total</div>
          <canvas id="barChart" class="chart-canvas" height="180"></canvas>
        </div>
        <div class="chart-card full">
          <div class="chart-title">7-Day Heatmap</div>
          <div id="heatmapWrap" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
        </div>
      </div>
    </div>

    <!-- CONSOLIDATED VIEW -->
    <div class="view" id="view-consolidated">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-0.02em">All Days</div>
      </div>
      <div class="chart-card" style="margin-bottom:20px">
        <table class="cons-table" id="consTable"></table>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
let currentDate = todayStr();
let currentData = { tasks: [] };
let lineChart, barChart;

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}

// ── INIT ──
document.getElementById('headerDate').textContent = fmtDate(todayStr());
loadDay(todayStr());
loadSidebar();

// ── SIDEBAR ──
async function loadSidebar() {
  const dates = await fetch('/api/dates').then(r=>r.json());
  const cons   = await fetch('/api/consolidated').then(r=>r.json());
  const pctMap = {};
  cons.forEach(c => pctMap[c.date] = c.pct);

  const el = document.getElementById('dateList');
  el.innerHTML = '';
  dates.forEach(d => {
    const pct = pctMap[d] ?? 0;
    const div = document.createElement('div');
    div.className = 'date-item' + (d===currentDate?' active':'');
    div.innerHTML = `<span class="d-label">${fmtDate(d)}</span><span class="d-pct ${pct>=100?'full':''}">${pct}%</span>`;
    div.onclick = ()=>loadDay(d);
    el.appendChild(div);
  });
}

function newDayToday() { loadDay(todayStr()); }

// ── LOAD DAY ──
async function loadDay(dateStr) {
  currentDate = dateStr;
  const data = await fetch(`/api/day/${dateStr}`).then(r=>r.json());
  currentData = data;
  renderDay();
  loadSidebar();
}

function renderDay() {
  document.getElementById('dayTitle').textContent = fmtDate(currentDate);
  const tasks = currentData.tasks||[];
  const total  = tasks.length;
  const done   = tasks.filter(t=>t.done).length;
  const pct    = total ? Math.round(done/total*100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statLeft').textContent  = total - done;
  document.getElementById('pbarLabel').textContent = `${done} / ${total}`;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('daySubtitle').textContent = done===total && total>0 ? '🎉 All done!' : `${total-done} remaining`;

  const circ = 2 * Math.PI * 32;
  const offset = circ - (pct/100)*circ;
  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringFill').style.strokeDasharray  = circ;

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  if (!tasks.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📝</div><p>No tasks yet. Add one below!</p></div>`;
    return;
  }

  tasks.forEach((t,i) => {
    const div = document.createElement('div');
    div.className = 'task-item' + (t.done?' done':'');
    div.innerHTML = `
      <div class="checkbox ${t.done?'checked':''}" onclick="toggleTask(${i})"></div>
      <div class="task-text">${escHtml(t.text)}</div>
      <span class="task-priority ${t.priority}">${t.priority.toUpperCase()}</span>
      <button class="task-delete" onclick="deleteTask(${i})">✕</button>
    `;
    list.appendChild(div);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── TASK ACTIONS ──
async function addTask() {
  const inp = document.getElementById('taskInput');
  const text = inp.value.trim();
  if (!text) return;
  const priority = document.getElementById('prioritySelect').value;
  currentData.tasks = currentData.tasks||[];
  currentData.tasks.push({ text, done:false, priority, created: new Date().toISOString() });
  inp.value = '';
  await saveDay();
  renderDay();
  loadSidebar();
  showToast('Task added!');
}

async function toggleTask(i) {
  currentData.tasks[i].done = !currentData.tasks[i].done;
  await saveDay();
  renderDay();
  loadSidebar();
}

async function deleteTask(i) {
  currentData.tasks.splice(i,1);
  await saveDay();
  renderDay();
  loadSidebar();
  showToast('Task removed');
}

async function saveDay() {
  await fetch(`/api/day/${currentDate}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(currentData)
  });
}

// ── VIEWS ──
function showView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  event.target.classList.add('active');

  if (name==='charts') renderCharts();
  if (name==='consolidated') renderConsolidated();
}

// ── CHARTS ──
async function renderCharts() {
  const data = await fetch('/api/consolidated').then(r=>r.json());
  const rev  = [...data].reverse();
  const labels = rev.map(d=>d.date.slice(5));
  const pcts   = rev.map(d=>d.pct);
  const dones  = rev.map(d=>d.done);
  const totals = rev.map(d=>d.total);

  if (lineChart) lineChart.destroy();
  if (barChart)  barChart.destroy();

  const lineCtx = document.getElementById('lineChart').getContext('2d');
  lineChart = new Chart(lineCtx, {
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'Completion %',
        data: pcts,
        borderColor:'#7c6af7',
        backgroundColor:'rgba(124,106,247,0.08)',
        fill:true, tension:0.4,
        pointBackgroundColor:'#7c6af7', pointRadius:4,
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{min:0,max:100,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b85',font:{family:'DM Mono'}}},
        x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b85',font:{family:'DM Mono'}}}
      },
      responsive:true
    }
  });

  const barCtx = document.getElementById('barChart').getContext('2d');
  barChart = new Chart(barCtx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'Done', data:dones, backgroundColor:'rgba(74,222,128,0.7)', borderRadius:6 },
        { label:'Total', data:totals, backgroundColor:'rgba(124,106,247,0.3)', borderRadius:6 }
      ]
    },
    options:{
      plugins:{legend:{labels:{color:'#6b6b85',font:{family:'DM Mono'}}}},
      scales:{
        y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b85',font:{family:'DM Mono'}}},
        x:{grid:{display:false},ticks:{color:'#6b6b85',font:{family:'DM Mono'}}}
      },
      responsive:true
    }
  });

  // Heatmap
  const hm = document.getElementById('heatmapWrap');
  hm.innerHTML = '';
  const last14 = data.slice(0,14).reverse();
  last14.forEach(d => {
    const pct = d.pct;
    const alpha = pct===0 ? 0.08 : 0.12 + (pct/100)*0.88;
    const box = document.createElement('div');
    box.style.cssText = `
      width:60px;height:60px;border-radius:10px;
      background:rgba(124,106,247,${alpha});
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      border:1px solid rgba(124,106,247,0.2); cursor:default;
    `;
    box.innerHTML = `<div style="font-size:.65rem;color:#6b6b85;">${d.date.slice(5)}</div>
                     <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;">${pct}%</div>`;
    hm.appendChild(box);
  });
}

// ── CONSOLIDATED ──
async function renderConsolidated() {
  const data = await fetch('/api/consolidated').then(r=>r.json());
  const tbl  = document.getElementById('consTable');
  tbl.innerHTML = `
    <thead><tr>
      <th>Date</th>
      <th>Total</th>
      <th>Done</th>
      <th>Remaining</th>
      <th>Progress</th>
      <th>Status</th>
    </tr></thead>
    <tbody id="consTbody"></tbody>
  `;
  const tbody = document.getElementById('consTbody');
  data.forEach(d => {
    const tr = document.createElement('tr');
    tr.style.cursor='pointer';
    tr.innerHTML = `
      <td>${fmtDate(d.date)}</td>
      <td>${d.total}</td>
      <td style="color:var(--green)">${d.done}</td>
      <td style="color:var(--accent2)">${d.total-d.done}</td>
      <td>
        <div class="pct-bar-inline">
          <div class="bar"><div class="fill" style="width:${d.pct}%"></div></div>
          <div class="pct-val">${d.pct}%</div>
        </div>
      </td>
      <td><span class="badge ${d.pct>=100?'':'incomplete'}">${d.pct>=100?'✓':'…'}</span></td>
    `;
    tr.onclick = ()=>{ loadDay(d.date); showViewByName('day'); };
    tbody.appendChild(tr);
  });
}

function showViewByName(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab')[0].classList.add('active');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
</script>
